<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Irsalio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/content.css" />
    <link rel="stylesheet" href="css/calendar.css" />
    <link rel="stylesheet" href="css/panel.css" />
    <link rel="stylesheet" href="css/modals.css" />
    <link rel="stylesheet" href="css/utilities.css" />
  </head>
  <body>
    <section class="boot" id="boot-screen">
      <div class="boot-card">
        <div class="brand-mark">
          <svg
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <circle cx="12" cy="12" r="6" />
            <circle cx="12" cy="12" r="2" />
          </svg>
        </div>
        <h1 class="boot-name">Irsalio</h1>
        <p class="boot-note">Загрузка…</p>
      </div>
    </section>

    <section class="auth" id="auth-screen" hidden>
      <div class="auth-card">
        <div class="auth-head">
          <div class="brand-mark">
            <svg
              width="28"
              height="28"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="10" />
              <circle cx="12" cy="12" r="6" />
              <circle cx="12" cy="12" r="2" />
            </svg>
          </div>
          <h1 class="auth-title">Irsalio</h1>
          <p class="auth-subtitle">Персональный таск-менеджер</p>
        </div>

        <div class="auth-mode-switch" id="auth-mode-switch">
          <div class="auth-mode-label">
            <span id="auth-mode-status">Определение режима…</span>
          </div>
          <div class="segmented auth-mode-segmented">
            <button
              type="button"
              class="segmented-button"
              id="mode-local-btn"
              data-mode="local"
              onclick="window.__switchMode && window.__switchMode('local')"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="3" width="20" height="14" rx="2" />
                <line x1="8" y1="21" x2="16" y2="21" />
                <line x1="12" y1="17" x2="12" y2="21" />
              </svg>
              <span>Локально</span>
            </button>
            <button
              type="button"
              class="segmented-button"
              id="mode-server-btn"
              data-mode="server"
              onclick="window.__switchMode && window.__switchMode('server')"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <ellipse cx="12" cy="5" rx="9" ry="3" />
                <path d="M3 5v14a9 3 0 0 0 18 0V5" />
                <path d="M3 12a9 3 0 0 0 18 0" />
              </svg>
              <span>Сервер</span>
            </button>
          </div>
          <div class="auth-mode-hint" id="auth-mode-hint"></div>
        </div>

        <div class="auth-tabs" role="tablist">
          <button
            class="auth-tab is-active"
            id="auth-tab-login"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
          >
            Вход
          </button>
          <button
            class="auth-tab"
            id="auth-tab-register"
            role="tab"
            aria-selected="false"
            aria-controls="register-form"
          >
            Регистрация
          </button>
        </div>

        <div id="auth-error" class="form-error" hidden></div>

        <form class="auth-form" id="login-form">
          <label class="field">
            <span class="field-label">Логин</span>
            <input
              class="input"
              type="text"
              id="login-username"
              placeholder="user"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">Пароль</span>
            <div class="password-control">
              <input
                class="input"
                type="password"
                id="login-password"
                placeholder="••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle="#login-password"
                aria-label="Показать пароль"
              >
                <svg
                  class="icon-eye"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="icon-eye-off"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </label>
          <button class="btn btn-primary btn-block" type="submit">Войти</button>
        </form>

        <form class="auth-form" id="register-form" hidden>
          <label class="field">
            <span class="field-label">Логин</span>
            <input
              class="input"
              type="text"
              id="register-username"
              placeholder="user"
              autocomplete="username"
              required
            />
          </label>
          <label class="field">
            <span class="field-label">Имя</span>
            <input
              class="input"
              type="text"
              id="register-display-name"
              placeholder="Иван"
              autocomplete="name"
            />
          </label>
          <label class="field">
            <span class="field-label">Пароль</span>
            <div class="password-control">
              <input
                class="input"
                type="password"
                id="register-password"
                placeholder="Мин. 6 символов"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle="#register-password"
                aria-label="Показать пароль"
              >
                <svg
                  class="icon-eye"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="icon-eye-off"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </label>
          <label class="field">
            <span class="field-label">Повторите пароль</span>
            <div class="password-control">
              <input
                class="input"
                type="password"
                id="register-password-repeat"
                placeholder="Ещё раз"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                data-password-toggle="#register-password-repeat"
                aria-label="Показать пароль"
              >
                <svg
                  class="icon-eye"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
                <svg
                  class="icon-eye-off"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                  />
                  <line x1="1" y1="1" x2="23" y2="23" />
                </svg>
              </button>
            </div>
          </label>
          <button class="btn btn-primary btn-block" type="submit">
            Создать аккаунт
          </button>
        </form>
      </div>
    </section>

    <div class="app" id="app-screen" hidden>
      <div class="layout">
        <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
        <aside class="sidebar">
          <div class="sidebar-header">
            <div class="brand">
              <div class="brand-logo">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.7"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="10" />
                  <circle cx="12" cy="12" r="6" />
                  <circle cx="12" cy="12" r="2" />
                </svg>
              </div>
              <span class="brand-name">Irsalio</span>
            </div>
            <div class="sidebar-header-right">
              <span
                class="storage-mode-badge"
                id="storage-mode-badge"
                title=""
              ></span>
              <button class="icon-btn" id="sidebar-close" aria-label="Закрыть">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M18 6L6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <button class="workspace-button" id="workspace-button">
            <span class="workspace-name" id="workspace-name">Пространство</span>
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M6 9l6 6 6-6" />
            </svg>
          </button>

          <button
            class="btn btn-primary btn-block sidebar-new"
            id="new-record-button"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
            <span>Новая запись</span>
          </button>

          <div class="sidebar-tabs">
            <button class="sidebar-tab" data-sidebar-tab="records">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="22 12 16 12 14 15 10 15 8 12 2 12" />
                <path
                  d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"
                />
              </svg>
              <span>Записи</span>
            </button>
            <button class="sidebar-tab" data-sidebar-tab="dashboard">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
              </svg>
              <span>Дашборд</span>
            </button>
            <button class="sidebar-tab" data-sidebar-tab="dates">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <path d="M16 2v4M8 2v4M3 10h18" />
              </svg>
              <span>Календарь</span>
            </button>
            <button class="sidebar-tab" data-sidebar-tab="attention">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10" />
                <path d="M12 8v4M12 16h.01" />
              </svg>
              <span>Внимание</span>
              <span class="tab-badge" id="attention-count" hidden>0</span>
            </button>
          </div>

          <div class="sidebar-body" id="sidebar-body"></div>

          <div class="sidebar-footer">
            <div class="user-info" id="user-info"></div>
            <div class="sidebar-actions">
              <button
                class="icon-btn"
                id="settings-button"
                aria-label="Настройки"
              >
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="3" />
                  <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
                  />
                </svg>
              </button>
              <button class="icon-btn" id="theme-toggle" aria-label="Тема">
                <svg
                  class="theme-icon-sun"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
                  />
                </svg>
                <svg
                  class="theme-icon-moon"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
              </button>
              <button class="icon-btn" id="logout-button" aria-label="Выйти">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
              </button>
            </div>
          </div>
        </aside>

        <main class="workspace">
          <header class="topbar">
            <div class="topbar-left">
              <button
                class="icon-btn mobile-only"
                id="sidebar-open"
                aria-label="Меню"
              >
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 12h18M3 6h18M3 18h18" />
                </svg>
              </button>
              <div class="topbar-heading">
                <h1 class="page-title" id="topbar-title">Записи</h1>
                <p class="page-subtitle" id="topbar-subtitle"></p>
              </div>
            </div>
            <button class="search-input-btn" id="search-button">
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <path d="M21 21l-4.35-4.35" />
              </svg>
              <span class="search-placeholder">Поиск...</span>
            </button>
            <div class="topbar-right">
              <div class="records-tools" id="records-tools">
                <select
                  class="input-sm"
                  id="status-filter-select"
                  aria-label="Фильтр по состоянию"
                >
                  <option value="">Все</option>
                  <option value="todo">К выполнению</option>
                  <option value="in_progress">В работе</option>
                  <option value="done">Выполнено</option>
                  <option value="overdue">Просроченные</option>
                </select>
                <div class="sort-group">
                  <select
                    class="input-sm"
                    id="sort-select"
                    aria-label="Сортировка"
                  >
                    <option value="created_at">По дате</option>
                    <option value="due_at">По сроку</option>
                    <option value="priority">По приоритету</option>
                  </select>
                  <button
                    class="icon-btn-sm sort-order-btn"
                    id="order-button"
                    aria-label="Порядок"
                  >
                    <svg
                      class="order-icon-desc"
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 5v14M19 12l-7 7-7-7" />
                    </svg>
                    <svg
                      class="order-icon-asc"
                      width="14"
                      height="14"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M12 19V5M5 12l7-7 7 7" />
                    </svg>
                  </button>
                </div>
                <select
                  class="input-sm"
                  id="type-filter-select"
                  aria-label="Фильтр по типу"
                >
                  <option value="">Все типы</option>
                </select>
              </div>
            </div>
          </header>
          <div class="content" id="content"></div>
        </main>
      </div>

      <button
        class="mobile-fab mobile-only"
        id="mobile-create"
        aria-label="Новая запись"
      >
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>

      <div class="task-panel-backdrop" id="task-panel-backdrop" hidden></div>
      <aside class="task-panel" id="task-panel" hidden></aside>
    </div>

    <div id="modal-root"></div>
    <div class="toast-root" id="toast-root"></div>

    <script src="js/vendor/marked.min.js"></script>
    <script type="module" src="js/app/app.js"></script>
  </body>
</html>
